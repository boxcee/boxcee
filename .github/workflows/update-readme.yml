name: Update README

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - ".github/workflows/update-readme.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  markscribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: muesli/readme-scribe@d2f6ab32d6b9f5b59941fe782d6c7e6499a37fe4 # master
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - uses: stefanzweifel/git-auto-commit-action@v7.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: Update generated README
          branch: main
          commit_user_name: README-bot
          commit_user_email: readme-bot@schmitzvonhuelst.de
          commit_author: README-bot <readme-bot@schmitzvonhuelst.de>
